[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dhb"
version = "0.2.0"
description = "Theory/HBHS/LLP signal enrichment and boundary atlas stages for DiHiggs"
requires-python = ">=3.8"
dependencies = ["PyYAML>=5.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dhb*"]

[tool.pytest.ini_options]
markers = [
    "integration: requires an installed Higgs module and the HB/HS datasets",
]
