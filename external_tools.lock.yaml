# External physics tools this repo depends on, pinned in one place.
#
# Purpose: give the three-repo ecosystem (dihiggs, dihiggs_boundary,
# dihiggs_hep_cross) a single, diffable manifest of which upstream tool
# versions each repo builds against, so version drift is detectable instead of
# hidden in directory names and build scripts. The declared versions must AGREE
# across the three manifests -- that agreement is the cross-repo "version pin".
# tests/test_external_tools.py enforces the versions and the convention SHA-256 pin.
schema_version: external_tools_v1

# The convention file lives only in dihiggs (conventions/physics_conventions.yaml).
# The SHA-256 pins its canonical v3 bytes; scripts/check_workspace.py verifies them.
conventions:
  owner: dihiggs
  schema_version: physics_conventions_v3
  sha256: 4f3a938ed54dbc779d25f691ce1dd06fe17af69751105dc3b69ccb6b7d92fff6

tools:
  2HDMC:
    version: "1.8"
    upstream_url: https://2hdmc.hepforge.org/
    distribution: tarball          # not a git repo -> cannot be a git submodule
    vendored_path: lib/2HDMC-1.8.0
    local_patches: []              # closer to stock v1.8; project code lives in src/, not the vendored tree

  HiggsTools:
    version: v1.2
    upstream_url: https://gitlab.com/higgsbounds/higgstools
    upstream_ref: v1.2
    distribution: git
    vendored_path: lib/higgstools-v1.2
    local_patches: []

  HiggsBounds_dataset:
    version: v1.7
    upstream_url: https://gitlab.com/higgsbounds/hbdataset
    upstream_ref: v1.7
    distribution: git
    vendored_path: dataset/hbdataset-v1.7
    local_patches: []

  HiggsSignals_dataset:
    version: v1.1
    upstream_url: https://gitlab.com/higgsbounds/hsdataset
    upstream_ref: v1.1
    distribution: git
    vendored_path: dataset/hsdataset-v1.1
    local_patches: []
